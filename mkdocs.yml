site_name: Deltares doc_utils
site_description: Documentation utilities for converting Markdown to LaTeX
repo_url: https://github.com/Deltares-research/doc_utils
repo_name: Deltares-research/doc_utils

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - RepoCloner & authentication: guides/repo-cloner-authentication.md
      - Installing pdfLaTeX: guides/installing-pdflatex.md
  - API Reference:
      - Overview: reference/index.md
      - ddocs.cli: reference/cli.md
      - ddocs.markdown: reference/markdown.md
      - ddocs.latex.clean: reference/clean.md
      - ddocs.markdown.pandoc_utils: reference/pandoc_utils.md
      - ddocs.latex.pdflatex_utils: reference/pdflatex_utils.md
      - ddocs.templates.repo_cloner: reference/repo_cloner.md
  - Changelog: changelog.md
