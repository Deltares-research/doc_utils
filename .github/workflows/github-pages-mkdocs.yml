name: Deploy MkDocs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published

jobs:
  deploy-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy PR documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@b655376b4a9c0b0b37f7f730f840f11c7220d1a6 # mkdocs-deploy/v1.0.1
        with:
          python-version: '3.11'
          package-manager: uv
          install-groups: docs
          trigger: pr
          deploy-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy main documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@b655376b4a9c0b0b37f7f730f840f11c7220d1a6 # mkdocs-deploy/v1.0.1
        with:
          python-version: '3.11'
          package-manager: uv
          install-groups: docs
          trigger: main
          deploy-token: ${{ secrets.GITHUB_TOKEN }}
          main-set-default: 'false'

  deploy-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy release documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@b655376b4a9c0b0b37f7f730f840f11c7220d1a6 # mkdocs-deploy/v1.0.1
        with:
          python-version: '3.11'
          package-manager: uv
          install-groups: docs
          trigger: release
          deploy-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ github.event.release.tag_name }}
          release-alias: latest
          release-prerelease: ${{ github.event.release.prerelease }}
