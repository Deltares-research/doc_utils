name: pip-audit

# Dependency-vulnerability scan. CVEs are disclosed over time against packages we already
# ship, so besides every PR the weekly schedule re-audits the unchanged tree and catches a
# freshly disclosed vulnerability without needing a code change.

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    # uv.lock is a universal lockfile: some pins only apply to certain python versions (environment markers),
    # so the export is audited once per python version >= requires-python (3.11). Keep in sync with pyproject.toml.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with uv
        uses: Deltares-research/github-actions/actions/python-setup/uv@d60c8767cd8efb9c42850eabac6845cbe015d772 # uv/v1.0.1
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev

      - name: Audit dependencies with pip-audit
        # Export the locked (pinned) dependency set from uv.lock and check it against the PyPI/OSV advisory DB.
        # pip-audit runs through uvx so it is never added to the project's own dependency graph. --frozen refuses
        # to touch the lockfile. pip-audit runs under the matrix interpreter so version markers resolve per leg;
        # --no-deps/--disable-pip audit the pins as-is without resolving or installing.
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt > "${RUNNER_TEMP}/pip-audit-reqs.txt"
          echo "Auditing $(grep -cE '^[A-Za-z0-9_.-]+==' "${RUNNER_TEMP}/pip-audit-reqs.txt") pinned packages (python ${{ matrix.python-version }})"
          uvx --python ${{ matrix.python-version }} pip-audit --requirement "${RUNNER_TEMP}/pip-audit-reqs.txt" --no-deps --disable-pip --desc
