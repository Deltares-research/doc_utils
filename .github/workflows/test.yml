name: ci

permissions:
    contents: read

env:
  SVN_USERNAME: x-access-token
  SVN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
  workflow_dispatch:

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python with uv
        uses: Deltares-research/github-actions/actions/python-setup/uv@main
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version

      - name: tests
        run: |
          uv run pytest -svvv --cov=src/ddocs --cov-report=xml

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v3

      - name: test Jupyter notebook
        shell: bash
        run: |
          uv run pytest --nbval --nbval-lax docs/ --verbose --continue-on-collection-errors || echo "No notebooks found or collection errors occurred"
