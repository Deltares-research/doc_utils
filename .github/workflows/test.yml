name: ci

permissions:
    contents: read

on:
  push:
  workflow_dispatch:

jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python with uv
        uses: Deltares-research/github-actions/actions/python-setup/uv@35542e0d629396ac64162d8a5df6110484009147 # uv/v1.1.2
        with:
          python-version: ${{ matrix.python-version }}
          install-groups: dev

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pandoc --version

      - name: Cache TinyTeX
        # ddocs installs TinyTeX (one consistent TeX Live release) on first use; cache it between runs.
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-v1

      - name: tests
        # A token with read access to the private Deltares/LatexInstallation repo is
        # required by the live clone / PDF e2e tests (conftest bridges
        # LATEX_REPO_TOKEN -> GITHUB_TOKEN). Scoped to this step only so it is not
        # exposed to checkout/setup/upload steps. GITHUB_* names are reserved by
        # Actions, so a distinct secret name is required.
        env:
          LATEX_REPO_TOKEN: ${{ secrets.LATEX_REPO_TOKEN }}
        run: |
          uv run pytest -svvv --cov=src/ddocs --cov-report=xml

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

      - name: test Jupyter notebook
        shell: bash
        run: |
          uv run pytest --nbval --nbval-lax docs/ --verbose --continue-on-collection-errors || echo "No notebooks found or collection errors occurred"
